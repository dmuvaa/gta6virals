{% extends "base.html" %}
{% block footer %}{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth card" style="padding:32px">
  <h1>Welcome back</h1>
  <p class="sub">Log in to your {{ brand }} account</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Email <input name="email" type="email" autocomplete="email" required value="{{ email }}" autofocus></label>
    <label class="field">Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
  </form>
  <p class="alt">New here? <a href="{{ url_for('auth.signup', next=request.args.get('next')) }}">Create a free account</a></p>
  <p class="alt" style="margin-top:8px;font-size:13px">Forgot your password? Email <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</p>
</div></div>
{% endblock %}
