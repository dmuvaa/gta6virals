{% extends "base.html" %}
{% block footer %}{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth card" style="padding:32px">
  <h1>Create your account</h1>
  <p class="sub">Free plan · No credit card needed</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Name <input name="name" autocomplete="name" value="{{ form.name }}" maxlength="80"></label>
    <label class="field">Email <input name="email" type="email" autocomplete="email" required value="{{ form.email }}"></label>
    <label class="field">Password <input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label>
    <label class="check" style="font-size:13px;color:var(--muted)"><input type="checkbox" name="agree" value="1"> I agree to the <a href="/legal/terms" target="_blank">Terms</a> and <a href="/legal/privacy" target="_blank">Privacy Policy</a></label>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
  </form>
  <p class="alt">Already have an account? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">Log in</a></p>
</div></div>
{% endblock %}
