# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Render runs the Python API + worker. The Next.js website (web/) is deployed on Vercel.
services:
  # ------------------------------------------------------------ Python API
  - type: web
    name: hypecut-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: hypecut-backend
      - key: WEB_ORIGINS                   # the website URL(s) on Vercel, comma-separated, for CORS
        sync: false
      - key: API_URL                       # this service's own public URL
        sync: false

  # ------------------------------------------------------------ Worker (video processing)
  - type: worker
    name: hypecut-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: ./start.sh worker
    plan: standard                         # 2 GB RAM: decoding, previews, ffmpeg renders
    autoDeploy: true
    envVars:
      - fromGroup: hypecut-backend

envVarGroups:
  - name: hypecut-backend                  # shared by API + worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY           # server-only
        sync: false
      - key: R2_ACCOUNT_ID                 # Cloudflare R2 is required in production
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: JOB_TTL_HOURS
        value: "48"
      - key: BRAND_NAME
        value: Hypecut
      - key: PADDLE_ENV
        value: sandbox
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_CREATOR
        sync: false
      - key: PADDLE_PRICE_PRO
        sync: false
