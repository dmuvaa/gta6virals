services:
  - type: web
    name: hypecut
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # 2 GB RAM / 1 CPU. "starter" (512 MB) is too small for video work.
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: data
      mountPath: /data        # database, projects and clips live here
      sizeGB: 50
    envVars:
      - key: SITE_URL         # e.g. https://hypecut.onrender.com or your own domain
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: JOB_TTL_HOURS
        value: "48"
      - key: MIN_FREE_GB
        value: "5"
      # Paddle Billing. Leave empty until your Paddle account is approved:
      # the site works on the free plan and shows "paid plans open soon".
      - key: PADDLE_ENV
        value: sandbox
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_CREATOR
        sync: false
      - key: PADDLE_PRICE_PRO
        sync: false
